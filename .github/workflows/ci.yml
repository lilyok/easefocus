name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build iOS
        run: |
          xcodebuild \
            -project EaseFocus.xcodeproj \
            -scheme EaseFocus \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test macOS
        run: |
          xcodebuild \
            -project EaseFocus.xcodeproj \
            -scheme EaseFocus \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test \
            -skip-testing:EaseFocusUITests
